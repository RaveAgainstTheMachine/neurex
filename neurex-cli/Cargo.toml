[package]
name = "neurex-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bollard = "0.14"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
flate2 = "1.1.9"
mime_guess = "2.0.5"
reqwest = { version = "0.13.3", features = ["blocking", "json", "stream"] }
rust-embed = "8.11.0"
sysinfo = "0.38.4"
tar = "0.4.45"
tokio = { version = "1.52.1", features = ["full"] }
zip = "8.6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.4", features = ["env-filter"] }
anyhow = "1.0"
tower-http = { version = "0.6", features = ["fs", "trace"] }
wasmtime = "29.0.1"
wasmtime-wasi = "29.0.1"
wasi-common = "29.0.1"
cap-std = "3.4.1"
serde = { version = "1.0", features = ["derive"] }
