[package]
name = "neurex-cli"
version = "0.5.2"
edition = "2024"
repository = "https://github.com/RaveAgainstTheMachine/neurex"
homepage = "https://github.com/RaveAgainstTheMachine/neurex"
description = "The first autonomous engineering workspace for the neural era."

[dependencies]
axum = { version = "0.8.9", features = ["ws", "http2"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bollard = "0.14"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
flate2 = "1.1.9"
mime_guess = "2.0.5"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "stream", "rustls"] }
rust-embed = "8.11.0"
sysinfo = "0.38.4"
tar = "0.4.45"
tokio-tungstenite = "0.26.1"
tungstenite = "0.26.1"
futures-util = "0.3"
tokio = { version = "1.52.1", features = ["full"] }
zip = "8.6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
tower-http = { version = "0.6", features = ["fs", "trace"] }
wasmtime = "36.0.8"
wasmtime-wasi = "33.0.2"
wasi-common = "29.0.1"
cap-std = "3.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
axum-server-dual-protocol = "0.7.0"
