<!doctype html>
<html lang="en" style="height:100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neurex IDE</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      body, #root { height: 100%; margin: 0; overflow: hidden; background: #09090b; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      /* Pre-JS Loading Screen */
      #preloader {
        position: fixed; inset: 0; background: #09090b; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }
      #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      
      .preloader-title {
        font-size: 28px; font-weight: 900; letter-spacing: 0.4em; color: #fff; margin-bottom: 24px;
        background: linear-gradient(90deg, #fff, #9c6fff, #fff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-size: 200% auto; animation: shimmer 3s infinite linear;
      }
      
      .preloader-bar { width: 240px; height: 2px; background: rgba(255,255,255,0.05); border-radius: 1px; overflow: hidden; }
      .preloader-progress {
        height: 100%; width: 20%; background: #9c6fff;
        box-shadow: 0 0 15px rgba(156, 111, 255, 0.5);
        animation: loader-ramp 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes shimmer { to { background-position: 200% center; } }
      @keyframes loader-ramp { 0% { width: 5%; } 100% { width: 65%; } }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-title">NEUREX</div>
      <div class="preloader-bar">
        <div class="preloader-progress" id="preloader-progress"></div>
      </div>
    </div>

    <script>
      window.process = { env: { NODE_ENV: 'development' } };
      // Function to hide preloader - called by React
      window.hidePreloader = function() {
        const p = document.getElementById('preloader');
        if (p) p.classList.add('hidden');
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
